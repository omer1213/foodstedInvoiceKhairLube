<div class="login-container">
  <div class="login-card">
    <!-- Company Logo and Header -->
    <div class="login-header">
      <div class="logo-container">
        <img src="/logoMain.png" alt="Khair Lubricants Company" class="company-logo">
      </div>
      <h2 class="company-name">Khair Lubricants Company</h2>
      <h3 class="company-name-arabic">شركة خير للزيوت التشحيم</h3>
      <p class="login-subtitle">Invoice Management System</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Error Message -->
      @if (error()) {
        <div class="error-message">
          <svg class="error-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          {{ error() }}
        </div>
      }

      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">
          <svg class="input-icon" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
          Email
        </label>
        <input
          type="email"
          id="email"
          [value]="email()"
          (input)="onEmailChange($event)"
          placeholder="Enter your email"
          class="form-input"
          [disabled]="isLoading()"
          required
        >
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg class="input-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
          </svg>
          Password
        </label>
        <div class="password-input-container">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            [value]="password()"
            (input)="onPasswordChange($event)"
            placeholder="Enter your password"
            class="form-input password-input"
            [disabled]="isLoading()"
            required
          >
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading()"
          >
            @if (showPassword()) {
              <svg fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
            } @else {
              <svg fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading() || !email().trim() || !password().trim()"
      >
        @if (isLoading()) {
          <div class="loading-spinner"></div>
          Signing In...
        } @else {
          <svg class="button-icon" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm7.707 3.293a1 1 0 010 1.414L9.414 9H17a1 1 0 110 2H9.414l1.293 1.293a1 1 0 01-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
          Sign In
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; 2026 Khair Lubricants Company. All rights reserved.</p>
    </div>
  </div>

  <!-- Background decoration -->
  <div class="background-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>
</div>
